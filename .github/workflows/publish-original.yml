name: Publish original Socioscope frontend
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/build.mjs'
      - '.github/workflows/publish-original.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit compiled original Pages files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs
          if ! git diff --cached --quiet; then
            git commit -m "Build original Socioscope frontend"
            git push
          fi
